services:
  personal-website:
    container_name: personal-website
    build: .  # Builds from the Dockerfile in the current directory
    restart: unless-stopped
    ports:
      - "8080:8080" # Maps Pi port 8080 to container port 8080
    env_file:
      - .env # Loads your secrets/config
    environment:
      - SPRING_PROFILES_ACTIVE=prod # Optional: if you use profiles
    networks:
      - default
      - cloudflare-net

networks:
  cloudflare-net:
    external: true
